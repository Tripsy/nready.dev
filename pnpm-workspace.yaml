packages:
  - '.'
# pnpm 11 supersedes `onlyBuiltDependencies` with `allowBuilds`. All four compile or
# fetch a native binary at install time and are unusable without it — bcrypt above all,
# since password hashing is on the auth path.
allowBuilds:
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-cloudwatch-logs@3.1096.0'
  - '@aws-sdk/client-ses@3.1096.0'
  - '@aws-sdk/credential-provider-env@3.972.62'
  - '@aws-sdk/credential-provider-http@3.972.64'
  - '@aws-sdk/credential-provider-ini@3.973.7'
  - '@aws-sdk/credential-provider-login@3.972.69'
  - '@aws-sdk/credential-provider-node@3.972.73'
  - '@aws-sdk/credential-provider-process@3.972.62'
  - '@aws-sdk/credential-provider-sso@3.973.6'
  - '@aws-sdk/credential-provider-web-identity@3.972.68'
  - '@aws-sdk/nested-clients@3.997.36'
  - '@aws-sdk/token-providers@3.1096.0'
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
# mailtrap 4.8.0 asks for nodemailer ^9 but still pins @types/nodemailer to ^6, which is
# stale on their side — no published version pairs the two correctly. The runtime is
# nodemailer 9, so 8 is the matching type package and mailtrap keeps working against it.
peerDependencyRules:
  allowedVersions:
    mailtrap>@types/nodemailer: '8'
